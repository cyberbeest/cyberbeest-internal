# Debian 13 (trixie) preseed for Cyberbeest installs.
#
# Mirrors the answers in ~/Documents/debian-install.txt, which is the source
# of truth for this file -- if you change one, change the other. Locale,
# keyboard layout and timezone are deliberately NOT preseeded here: they're
# asked fresh during first-boot provisioning by
# provisioning/00-locale-keyboard-timezone.sh (see that script's header for
# why), so the installer just gets sane throwaway defaults it never shows.
#
# Built into a bootable ISO by build-iso.sh in this directory, which also
# copies cyberbeest-files/ onto the target disk via late_command below so
# provisioning starts itself on first desktop login.

### Loud disk-erasure warning, shown immediately once the installer starts
# (on top of the boot menu label and partman's own confirm screens later).
# NOTE: test-boot showed whiptail itself isn't part of this environment at
# all (exit 127) -- warn.sh now shows the warning via a debconf note
# template (debconf-loadtemplate + db_input critical) instead, the same
# cdebconf mechanism partman's own confirms below rely on. The boot menu
# label and partman's own confirms are still the actual safety net either
# way.
d-i preseed/early_command string sh /cdrom/cyberbeest-files/warn.sh

### Localization
# Locale and timezone are throwaway (overwritten by
# 00-locale-keyboard-timezone.sh on first login). Keyboard layout is
# deliberately NOT preseeded and left as a real question, even though
# priority=high still suppresses everything else that has an answer below:
# the very first LUKS unlock prompt, right after install and before
# provisioning has had any chance to run, uses whatever layout was baked
# into the initramfs during install. Getting that wrong means the operator
# can't even type the passphrase correctly to get in.
d-i debian-installer/locale string en_US.UTF-8
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cyberbeest
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

### Mirror ("Network mirror: yes")
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Additional media ("Additional media: no")
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true

### Account setup
# "root pw: empty" -- no root password is set, the first user gets sudo
# instead (standard Debian behavior when root-login is left disabled).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Cyberbeest
d-i passwd/username string cyberbeest
d-i passwd/user-password password change-me
d-i passwd/user-password-again password change-me
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitioning ("Guided - encrypted LVM", "All files in one partition")
# No d-i partman-auto/disk is set on purpose: these machines have a single
# disk, so partman picks it automatically. If a build ever targets hardware
# with more than one disk, this preseed will stall here rather than guess.
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-crypto/passphrase password change-me-now
d-i partman-crypto/passphrase-again password change-me-now
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/choose_partition select finish

# partman-lvm/confirm(_nooverwrite), partman-partitioning/confirm_write_new_label
# and partman/confirm(_nooverwrite) are deliberately left UNSET. They're the
# "really wipe this disk?" questions and are priority:critical specifically
# so they survive priority=critical/auto=true and still force a manual
# confirmation -- learned the hard way when a first version of this preseed
# wiped a disk with zero prompts. Everything up to this point (recipe,
# LVM, LUKS passphrase) still runs unattended; only the final "write changes
# to disk" screen needs a keypress.

### Package/desktop selection ("Desktop environment: gnome no, xfce yes")
tasksel tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string git curl
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

# Drop the first-boot provisioning autostart onto the new user's desktop.
# /cdrom is the install media itself inside the installer environment (works
# for both optical and USB boot), where build-iso.sh places cyberbeest-files/.
d-i preseed/late_command string \
	in-target mkdir -p /home/cyberbeest/.config/autostart; \
	cp /cdrom/cyberbeest-files/cyberbeest-provisioning.desktop /target/home/cyberbeest/.config/autostart/; \
	cp /cdrom/cyberbeest-files/cyberbeest-bootstrap.sh /target/home/cyberbeest/; \
	in-target chmod +x /home/cyberbeest/cyberbeest-bootstrap.sh; \
	in-target chown -R cyberbeest:cyberbeest /home/cyberbeest/.config /home/cyberbeest/cyberbeest-bootstrap.sh
