# Minimal preseed for the "manual partitioning" boot entry -- everything
# else (partitioning, keyboard, timezone, ...) stays interactive on purpose,
# this only pre-answers the two grub-installer questions that cause a
# genuine grub-install failure on buggy EFI firmware (see preseed.cfg's
# "Boot loader" section for the full explanation). Without this, the manual
# path hits the same failure the auto path would have, since both go
# through the same grub-installer component and this question is normally
# asked at low debconf priority -- easy to blow past without noticing during
# an otherwise-interactive install too.
d-i grub-installer/update-nvram boolean false
d-i grub-installer/force-efi-extra-removable boolean true
