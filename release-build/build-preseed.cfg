# Debian 13 (trixie) preseed for the automated release-build pipeline
# (release-build/01-base-install.sh), NOT for real end-user installs -- see
# ../preseed.cfg for that. Forked from it with these deliberate differences:
#
# - No LUKS (partman-auto/method regular, not crypto): these VM disks are
#   throwaway build artifacts that live only on tower and get deleted once
#   their output (qcow2/ISO) is extracted -- they never ship anywhere. LUKS
#   would also block fully unattended reboots (the passphrase prompt has no
#   console operator to answer it), which every later release-build stage
#   depends on. This does NOT affect what real end-user installs get --
#   ../preseed.cfg (used by build-iso.sh and combine-live-and-installer.sh
#   for actual installer sticks) is untouched and still encrypts. It also
#   doesn't affect the live-stick's own security model: remaster-live-stick.sh
#   captures the filesystem into a squashfs regardless of whether the source
#   disk was encrypted, and the existing KVM/VBox "sandbox VM" donor images
#   (build-kvm-donor-image.sh) are unencrypted for the same reason.
# - The "really wipe this disk?" confirms (partman-lvm/confirm(_nooverwrite),
#   partman-partitioning/confirm_write_new_label, partman/confirm(_nooverwrite))
#   ARE preseeded true here, unlike ../preseed.cfg. Safe here specifically
#   because 01-base-install.sh always points this at a freshly-created,
#   empty, purpose-built qcow2 file it just made itself -- never a real disk
#   that could hold someone's existing data. Don't reuse this preseed against
#   real hardware.
# - pkgsel/include adds openssh-server: every later stage drives the guest
#   over SSH, not a human at a console.
# - ...and qemu-guest-agent: 04-remaster.sh needs it after
#   99-remove-openssh-server.sh (part of the real provisioning sequence)
#   purges sshd -- see that script's own comment for why SSH can't be used
#   at that point. Kept in shipped artifacts by product decision
#   (2026-09-18): host-only virtio-serial channel, never network-exposed,
#   unlike sshd.
# - No cyberbeest-files/ late_command (warn.sh, the provisioning-desktop
#   autostart, bootstrap.sh) -- none of that exists on a plain Debian netinst
#   ISO anyway (it's only added when build-iso.sh authors the real installer
#   ISO). Autologin + the actual NN-*.sh provisioning run are driven directly
#   by 02-provision.sh over SSH instead, once per locale branch.

### Localization (throwaway -- overwritten by 00-locale-keyboard-timezone.sh
# during the real provisioning run in 02-provision.sh)
d-i debian-installer/locale string en_US.UTF-8
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true
# ../preseed.cfg deliberately leaves keyboard layout as a real interactive
# question (see its own comment) since a human operator is always present
# for a real install. There's no operator here, so it must be preseeded or
# priority=critical hangs forever on an unanswerable question with zero
# visible output (no disk writes, no DHCP lease even) -- exactly what
# happened the first time this was tried with the wrong (legacy,
# pre-console-setup-udeb) template name `console-keymaps-at/keymap`. The
# correct modern (console-setup-udeb) key is keyboard-configuration/xkb-keymap.
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cyberbeest-build
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
# Points the INSTALLER's own package fetching at apt-cacher-ng on tower
# (192.168.122.1 = tower's address on the libvirt `default` NAT network).
# This is installer-environment-only -- d-i does not persist it into the
# target system's own apt config, so it can't leak into the shipped image.
d-i mirror/http/proxy string http://192.168.122.1:3142

### Additional media
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true

### Account setup -- "live", not the real-install "change-me" default:
# this provisioned disk is branched into BOTH cyberbeest-vm.qcow2
# (03-vm-image.sh) and the live-stick ISO (04-remaster.sh), and "live" is
# what actually ships on the live stick, which never persists this
# password (or anything else) past a reboot -- it boots live-boot/
# squashfs+overlay, so there's no install here to nag about, unlike a real
# hardware install or the VM below. 03-vm-image.sh overrides this to
# "virtual" offline, well after this shared install step, specifically
# because the VM output DOES persist across boots and its own nag needs
# to track whatever its actual default is (see that script's comment).
# Irrelevant to the build pipeline itself either way, which authenticates
# over an SSH key, not this password (see lib/common.sh's rb_ensure_ssh_key).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Cyberbeest
d-i passwd/username string cyberbeest
d-i passwd/user-password password live
d-i passwd/user-password-again password live
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Partitioning -- plain ext4, no crypto, no LVM (see file header)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/choose_partition select finish
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Package/desktop selection
tasksel tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string git curl openssh-server qemu-guest-agent
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Boot loader (BIOS target -- 01-base-install.sh boots the VM with a plain
# seabios/i440fx machine type, no UEFI/OVMF, to keep this stage simple; the
# real product ships OVMF/UEFI, but that's a physical/product-install detail
# unrelated to whether this throwaway build VM can boot itself)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

# late_command runs while still inside the installer's own live environment,
# before the target is booted -- files delivered via --initrd-inject (like
# build_key.pub below) live at the installer's own filesystem root, NOT
# inside /target, so they're copied in via a plain `cp`, not `in-target`.
#
# Three throwaway-build-only conveniences, none of which apply to real
# end-user installs (../preseed.cfg is untouched):
# - build_key.pub -> cyberbeest's authorized_keys: every later release-build
#   stage drives the guest over key-based SSH, no human ever types a
#   password.
# - passwordless sudo: NN-*.sh scripts run via `sudo bash NN-*.sh` over SSH
#   with nothing to answer a password prompt.
# - lightdm autologin as cyberbeest: some NN-*.sh steps write xfconf/gsettings
#   state that needs a live, logged-in D-Bus session to take effect, with no
#   console operator ever present to click through a greeter.
d-i preseed/late_command string \
	in-target mkdir -p /home/cyberbeest/.ssh; \
	cp /build_key.pub /target/home/cyberbeest/.ssh/authorized_keys; \
	in-target chown -R cyberbeest:cyberbeest /home/cyberbeest/.ssh; \
	in-target chmod 700 /home/cyberbeest/.ssh; \
	in-target chmod 600 /home/cyberbeest/.ssh/authorized_keys; \
	in-target sh -c 'echo "cyberbeest ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/99-build-nopasswd && chmod 440 /etc/sudoers.d/99-build-nopasswd'; \
	in-target sh -c 'mkdir -p /etc/lightdm/lightdm.conf.d && printf "[Seat:*]\nautologin-user=cyberbeest\nautologin-user-timeout=0\n" > /etc/lightdm/lightdm.conf.d/50-autologin.conf'
